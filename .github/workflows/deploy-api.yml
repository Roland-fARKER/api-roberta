name: CI/CD - Despliegue API .NET 8 a Azure App Service

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'api-buffet-estudiante' # Reemplazar si le das otro nombre a tu App Service en Azure
  DOTNET_VERSION: '8.0.x'
  OUTPUT_PATH: '${{ github.workspace }}/publish'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente
      uses: actions/checkout@v4

    - name: Configurar entorno .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restaurar dependencias
      run: dotnet restore "BUFFET VEGETARIANO TIEN LAN ZU SHI/BUFFET VEGETARIANO TIEN LAN ZU SHI.sln"

    - name: Compilar proyecto (Release)
      run: dotnet build "BUFFET VEGETARIANO TIEN LAN ZU SHI/BUFFET VEGETARIANO TIEN LAN ZU SHI.sln" --configuration Release --no-restore

    - name: Publicar artefactos
      run: dotnet publish "BUFFET VEGETARIANO TIEN LAN ZU SHI/BUFFET VEGETARIANO TIEN LAN ZU SHI.csproj" -c Release -o ${{ env.OUTPUT_PATH }} --no-build

    - name: Desplegar hacia Azure WebApp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.OUTPUT_PATH }}
